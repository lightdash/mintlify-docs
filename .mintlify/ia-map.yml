# Placement annotations for the docs IA.
#
# This file carries ONLY the semantics: what a node is for, and where a boundary
# is contested, what it is not for and where that goes instead. The tree itself —
# names, nesting, and whether a node is an area or a section — is derived from
# docs.json, so it can never drift out of sync with the real structure.
#
# Read the joined tree with:  node scripts/ia-map.js
# That command also reports nodes missing an annotation and annotations whose
# node no longer exists, so a rename cannot leave this file quietly wrong.
#
# Keys are nav slugs. Update this file when you add, rename, move, or dissolve a
# node — not when you add a page.

get-started:
  for: The first run. Owns the journey, never the only explanation of a feature.
  not: The canonical explanation of any feature, which belongs in its product area.
get-started/quickstart:
  for: Wire it up and get data flowing. Exactly one page is called Quickstart.

explore:
  for: Using a semantic layer someone else defined.
  not: Defining fields (semantic-layer). The first-run journey (get-started).
explore/chart-types:
  for: The chart gallery, one page per type, deliberately flat.
Build charts:
  for: Configuring and calculating within a chart.
explore/table-calculations:
  for: Post-query maths on results.
explore/table-calculations/sql-templates:
  for: Copyable SQL patterns for common table calculations.
explore/dashboards:
  for: Assembling dashboards and interacting with them.
  not: Filtering in the Explore view, which is a different interface.
explore/explore-view:
  for: Running a query against a table.
  not: Dashboard filtering and interaction.
explore/metrics-catalog:
  for: Browsing and curating what is available to query.
Organize and share:
  for: Spaces, pinning, promotion, verification, delivery, and alerts.

semantic-layer:
  for: The modeling language itself — what fields mean.
  not: Connecting the tool that carries it (integrations). Querying it (explore).
semantic-layer/pre-aggregates:
  for: Materialized rollups and how queries match them.

workflow:
  for: The software lifecycle around the project — version control, previews, CI/CD, content as code, editor and agent tooling.
  not: The language you write in the project (semantic-layer).
workflow/cli:
  for: The Lightdash CLI — commands, flags, and the development loop.

agents:
  for: Lightdash AI agents.
Set up agents:
  for: Enabling, scoping, connecting tools, and tracking agents as code.
  not: Context, skills, memory, and evaluation for improving answers.
Work with agents:
  for: Asking, researching, and memory.
  not: Verification, evaluation, and review.
Improve answers:
  for: Verification, evaluation, and review.
  not: Asking, researching, and memory.

data-apps:
  for: Generated interactive apps built on the semantic layer.
  not: The sandbox runtime and hosting configuration (self-host).

embed:
  for: Putting Lightdash inside someone else's product.

integrations:
  for: Third-party tools Lightdash connects to — connecting, syncing, authenticating, version-matching.
integrations/dbt:
  for: The dbt integration. dbt is one way to express the semantic layer, not a requirement of it.
  not: Modeling advice, which outlives the dbt dependency (semantic-layer).

workspace-admin:
  for: Governance that affects other people.
  not: One person's own preference or credential (personal-settings).
Access and permissions:
  for: Roles, groups, user attributes, and service accounts.
workspace-admin/sso:
  for: Identity provider setup, including SCIM provisioning.
Organization settings:
  for: Organization and project configuration.
Monitoring and limits:
  for: Usage, compilation history, quotas, and instance health.

personal-settings:
  for: One person's own preferences and credentials.

self-host:
  for: What an operator does to the deployment to make features work.
  not: The feature itself, which belongs in its product area.
Install:
  for: Deployment paths for standing up an instance.
Upgrading:
  for: Version policy, release safety, and the upgrade runbook.
Connect services:
  for: Wiring external services to the instance.
Infrastructure:
  for: Database, storage, sandboxes, scheduler, and networking.
Access and licensing:
  for: Licence keys, SSO login, and entitlements.
self-host/nats-workers:
  for: Offloaded query execution.

support:
  for: Getting help and diagnosing problems.

api-reference/v1/introduction:
  for: OpenAPI-generated endpoint reference and SDKs.
