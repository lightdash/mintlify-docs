# Placement annotations for the docs IA.
#
# This file carries ONLY the semantics: what a node is for, and where a boundary
# is contested, what it is not for and where that goes instead. The tree itself —
# names, nesting, and whether a node is an area or a section — is derived from
# docs.json, so it can never drift out of sync with the real structure.
#
# Read the joined tree with:  aube run render:ia-map
# That command also reports nodes missing an annotation and annotations whose
# node no longer exists, so a rename cannot leave this file quietly wrong.
#
# Keys are nav slugs. Update this file when you add, rename, move, or dissolve a
# node — not when you add a page.

get-started:
  for: The first run — the Quickstart and the persona tracks. Owns the journey, never the only explanation of a feature.
  not: The canonical explanation of any feature, which belongs in its product area. Warehouse and project connection settings (integrations). Inviting users (workspace-admin).

explore:
  for: Using a semantic layer someone else defined.
  not: Defining fields (semantic-layer). The first-run journey (get-started). Chart types (visualizations).
Build charts:
  for: Configuring and calculating within a chart.
explore/table-calculations:
  for: Post-query maths on results.
explore/dashboards:
  for: Assembling dashboards and interacting with them.
  not: Filtering in the Explore view, which is a different interface.
explore/explore-view:
  for: Running a query against a table.
  not: Dashboard filtering and interaction.
explore/metrics-catalog:
  for: Browsing and curating what is available to query.
Organize and share:
  for: Spaces, pinning, promotion, verification, delivery, and alerts.

visualizations:
  for: The chart types readers pick from the chart gallery — Lightdash's built-in charts, the installable chart library, and custom chart types built with Vega or Chart Studio.
  not: Configuring an individual chart's data or appearance (explore, "Build charts").
Built-in charts:
  for: The default Lightdash chart types, one page per type, deliberately flat.
visualizations/custom-charts:
  for: Custom visualizations from the chart library, reusable chart types built in Chart Studio, and one-off Vega-Lite specs.

semantic-layer:
  for: The modeling language itself — what fields mean.
  not: Connecting the tool that carries it (integrations). Querying it (explore).
semantic-layer/pre-aggregates:
  for: Materialized rollups and how queries match them.

workflow:
  for: The software lifecycle around the project — version control, previews, CI/CD, content as code, Lightdash Desktop, editor and agent tooling.
  not: The language you write in the project (semantic-layer).
workflow/cli:
  for: The Lightdash CLI — commands, flags, and the development loop.

agents:
  for: Analytics workflows, reusable business context, and agent integrations in Lightdash.
Set up agents:
  for: Creating agents, access and identity, routing, and retention.
  not: Starting conversations (Work with agents) or maintaining reusable context (Improve answers).
Work with agents:
  for: Conversations, research, and creating or editing analytics content.
  not: Verification, evaluation, and review.
Improve answers:
  for: Project context, knowledge documents, skills, verification, evaluation, activity visibility, and reviewing findings.
  not: Starting conversations, running research, or scheduled maintenance.
Build agent workflows:
  for: Agents as code, repository changes, and scheduled project maintenance.
  not: Connecting external tools and clients, which belong in Integrations.
Integrations:
  for: Connecting agents to Slack, external MCP clients and tools, and the public Docs MCP server.
  not: Repository changes and agent deployment workflows, which belong in Build agent workflows.

data-apps:
  for: Generated interactive apps built on the semantic layer.
  not: Local app development and content as code (workflow). The sandbox runtime and hosting configuration (self-host).

embed:
  for: Putting Lightdash inside someone else's product.

integrations:
  for: Third-party tools Lightdash connects to — connecting, syncing, authenticating, version-matching.
integrations/dbt:
  for: The dbt integration. dbt is one way to express the semantic layer, not a requirement of it.
  not: Modeling advice, which outlives the dbt dependency (semantic-layer).
integrations/google-sheets:
  for: Connecting Google Sheets, exporting results, and querying Lightdash from the add-on.
Live data sources options:
  for: Three alternative drafts of the live data sources docs, kept side by side until one is chosen.
  not: Uploaded CSVs and Google Sheets copied into a project (explore, external sources).
integrations/live-data-sources-options/option-2:
  for: Draft with an overview and one page per live data source integration.
Option 3 tutorial and reference:
  for: Draft with a tutorial for connecting a live data source and a reference page.

workspace-admin:
  for: Governance that affects other people.
  not: One person's own preference or credential (personal-settings).
Access and permissions:
  for: Roles, groups, user attributes, and service accounts.
workspace-admin/sso:
  for: Identity provider setup, including SCIM provisioning.
Organization settings:
  for: Organization and project configuration.
Monitoring and limits:
  for: Usage, compilation history, quotas, and instance health.

personal-settings:
  for: One person's own preferences and credentials.

self-host:
  for: What an operator does to the deployment to make features work.
  not: The feature itself, which belongs in its product area.
Install:
  for: Deployment paths for standing up an instance.
Upgrading:
  for: How to check, run, troubleshoot and roll back an upgrade, and what each major version needs.
Connect services:
  for: Wiring external services to the instance.
Infrastructure:
  for: Database, storage, sandboxes, scheduler, and networking.
Access and licensing:
  for: SSO login and the licensed organization-roadmap service.
  not: License keys and per-feature enablement — self-host/enterprise-features.
self-host/enterprise-features:
  for: Getting and applying the enterprise license key, and enabling each licensed feature. The root page owns single-flag setup; multi-step setup lives with its runtime, including writeback under agents and the chart library under data apps.
  not: The product docs for those features, which live in their product area.
self-host/nats-workers:
  for: Offloaded query execution.

support:
  for: Getting help, diagnosing problems, and understanding feature maturity and availability.

api-reference/v1/introduction:
  for: OpenAPI-generated endpoint reference and SDKs.
