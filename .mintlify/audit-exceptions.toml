# Audit exceptions — deliberate departures from the IA rules, recorded so reviews
# don't re-litigate them. Resolving an audit flag means fixing it OR adding an
# entry here. The audit re-flags an entry only when the thing it covers materially
# grows past its snapshot: >10% more words, or any additional child. Outdated
# entries are reported for re-review, never silently dropped. See ia-rules.md.
#
# Each [[exceptions]] block is one standing decision. A page may hold more than one.
#
#   path       page or group the exception covers (slug, no extension)
#   check      flag being suppressed: "size" | "children" | "type" | "duplicate" | "stub"
#   metric     what `snapshot` counts: "words" | "children" (omit for non-numeric checks)
#   snapshot   the metric's value when granted; re-flag triggers on material growth
#   date       when the exception was granted
#   rationale  why it stands
#
# Example (delete when adding the first real entry):
#
# [[exceptions]]
# path = "get-started/quickstart/connect-project"
# check = "size"
# metric = "words"
# snapshot = 8965
# date = 2026-07-28
# rationale = "Canonical per-warehouse connection reference; per-warehouse split tracked in Phase 3 backlog."

exceptions = []
