<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="652" viewBox="0 0 1240 652" font-family="Inter, Arial, sans-serif" font-size="16" role="img" aria-labelledby="title desc">
  <title id="title">Who runs the query?</title>
  <desc id="desc">Users query directly or ask an agent. Agents use the person's credentials, a personal agent sign-in, or a shared agent account. Only the person's credential path may fall back to a project connection.</desc>
  <defs><radialGradient id="glow"><stop stop-color="#9d8dff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9990c4"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/><ellipse cx="620" cy="0" rx="744" ry="340" fill="url(#glow)"/>
  <g class="pele" transform="translate(0,-36)"><path d="M104 256V404" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><g transform="translate(104,334)"><rect x="-33.2" y="-11" width="66.4" height="22" rx="4" fill="#ffffff"/><text text-anchor="middle" fill="#737178" font-size="13"><tspan x="0" y="5">Request</tspan></text></g><path d="M156 224H288" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><g transform="translate(222,224)"><rect x="-26" y="-11" width="52" height="22" rx="4" fill="#ffffff"/><text text-anchor="middle" fill="#737178" font-size="13"><tspan x="0" y="5">Query</tspan></text></g><path d="M156 444H288" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><g transform="translate(222,444)"><rect x="-26" y="-11" width="52" height="22" rx="4" fill="#ffffff"/><text text-anchor="middle" fill="#737178" font-size="13"><tspan x="0" y="5">Query</tspan></text></g><path d="M386 390V286" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><g transform="translate(386,338)"><rect x="-29.6" y="-11" width="59.2" height="22" rx="4" fill="#ffffff"/><text text-anchor="middle" fill="#737178" font-size="13"><tspan x="0" y="5">Person</tspan></text></g><path d="M476 444H650" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><g transform="translate(564,444)"><rect x="-36.8" y="-29" width="73.6" height="58" rx="4" fill="#ffffff"/><text text-anchor="middle" fill="#737178" font-size="13"><tspan x="0" y="-13">Person's</tspan><tspan x="0" y="5">agent</tspan><tspan x="0" y="23">sign-in</tspan></text></g><path d="M440 466C512 496 510 586 570 586H650" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><g transform="translate(568,586)"><rect x="-29.6" y="-11" width="59.2" height="22" rx="4" fill="#ffffff"/><text text-anchor="middle" fill="#737178" font-size="13"><tspan x="0" y="5">Shared</tspan></text></g><path d="M445 205C500 166 510 166 552 166H650" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><g transform="translate(558,166)"><rect x="-40.4" y="-11" width="80.8" height="22" rx="4" fill="#ffffff"/><text text-anchor="middle" fill="#737178" font-size="13"><tspan x="0" y="5">Available</tspan></text></g><path d="M445 243C500 274 510 302 552 302H650" fill="none" stroke="#9990c4" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/><path d="M922 166H964C1018 166 1008 346 1055 346" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M922 302H964C1010 302 1016 362 1055 362" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M922 444H964C1010 444 1016 378 1055 378" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M922 586H964C1018 586 1008 394 1055 394" fill="none" stroke="#9990c4" stroke-width="1.5"  marker-end="url(#arrow)"/><g class="pele-node pele-shape-rounded actor" data-id="User" transform="translate(104,224)"><rect x="-52" y="-32" width="104" height="64" rx="12" fill="#f8fafb" stroke="#9990c4"/><text class="pele-label" text-anchor="middle" x="0" y="6" font-size="16">User</text></g><g class="pele-node pele-shape-rounded agent" data-id="Agent" transform="translate(104,444)"><rect x="-52" y="-32" width="104" height="64" rx="12" fill="#f8fafb" stroke="#9990c4"/><text class="pele-label" text-anchor="middle" x="0" y="6" font-size="16">Agent</text></g><g class="pele-node pele-shape-diam decision" data-id="Credentials" transform="translate(386,224)"><polygon points="0,-54 90,0 0,54 -90,0" fill="#f8fafb" stroke="#e1dfe7"/><text class="pele-label" text-anchor="middle" x="0" y="6" font-size="16">User credentials</text></g><g class="pele-node pele-shape-diam decision" data-id="Identity" transform="translate(386,444)"><polygon points="0,-54 90,0 0,54 -90,0" fill="#f8fafb" stroke="#e1dfe7"/><text class="pele-label" text-anchor="middle" x="0" y="6" font-size="16">Agent identity</text></g><g class="pele-node pele-shape-rounded personal" data-id="SignIn" transform="translate(790,444)"><rect x="-132" y="-40" width="264" height="80" rx="12" fill="#f8fafb" stroke="#9990c4"/><text class="pele-label" text-anchor="middle"><tspan x="0" y="-7" font-size="18" font-weight="600">User agent identity</tspan><tspan x="0" y="17" font-size="13">The person's agent sign-in</tspan></text></g><g class="pele-node pele-shape-rounded project" data-id="Shared" transform="translate(790,586)"><rect x="-132" y="-40" width="264" height="80" rx="12" fill="#f8fafb" stroke="#9990c4"/><text class="pele-label" text-anchor="middle"><tspan x="0" y="-7" font-size="18" font-weight="600">Project agent identity</tspan><tspan x="0" y="17" font-size="13">A shared agent account</tspan></text></g><g class="pele-node pele-shape-rounded personal" data-id="Personal" transform="translate(790,166)"><rect x="-132" y="-40" width="264" height="80" rx="12" fill="#f8fafb" stroke="#9990c4"/><text class="pele-label" text-anchor="middle"><tspan x="0" y="-7" font-size="18" font-weight="600">User</tspan><tspan x="0" y="17" font-size="13">Personal warehouse credentials</tspan></text></g><g class="pele-node pele-shape-rounded project" data-id="Project" transform="translate(790,302)"><rect x="-132" y="-40" width="264" height="80" rx="12" fill="#f8fafb" stroke="#9990c4"/><text class="pele-label" text-anchor="middle"><tspan x="0" y="-7" font-size="18" font-weight="600">Project</tspan><tspan x="0" y="17" font-size="13">Project warehouse connection</tspan></text></g><g class="pele-node pele-shape-cyl data" data-id="Warehouse" transform="translate(1122,370)"><path d="M-58.9,-24A58.9,8.41 0 0 1 58.9,-24V24A58.9,8.41 0 0 1 -58.9,24Z" fill="#f8fafb" stroke="#e1dfe7"/><path d="M-58.9,-24A58.9,8.41 0 0 0 58.9,-24" fill="none" stroke="#e1dfe7"/><text class="pele-label" text-anchor="middle" x="0" y="6" font-size="16">Warehouse</text></g></g>
  <style>
    .pele { --pele-bg:#ffffff; --pele-fg:#202024; --pele-muted:#737178; --pele-line:#9990c4; --pele-surface:#f8fafb; --pele-surface-alt:#ffffff; --pele-border:#e1dfe7; --pele-accent:#9d8dff; }
    .pele-node > rect { rx:12; ry:12; stroke-width:1.3; }
    .pele-cluster > rect {fill:none;stroke:none;}
    .pele-node.actor > rect {fill:#edf4ff;stroke:#3969b3;}
    .pele-node.actor .pele-label {fill:#3969b3;font-weight:600;}
    .pele-node.agent > rect {fill:#e4f8ef;stroke:#247558;stroke-width:1.5;}
    .pele-node.identity > rect {fill:#ece9ff;stroke:#9d8dff;}
    .pele-node.agent .pele-label {fill:#247558;font-weight:600;}
    .pele-node.personal > rect {fill:#edf4ff;stroke:#3969b3;}
    .pele-node.personal .pele-label {fill:#3969b3;}
    .pele-node.project > rect {fill:#ece9ff;stroke:#5c52d6;}
    .pele-node.project .pele-label {fill:#5c52d6;}
    .pele-node.personal .pele-label tspan:first-child,.pele-node.project .pele-label tspan:first-child {font-size:18px;font-weight:600;}
    .pele-node.personal .pele-label tspan:not(:first-child),.pele-node.project .pele-label tspan:not(:first-child) {font-size:12px;}
    .pele-node.data > path,.pele-node.data > ellipse {fill:#f8fafb;stroke:#9990c4;}
    .pele-node.decision > polygon {fill:#f8fafb;stroke:#e1dfe7;}
    .pele-edge path {stroke-width:1.5;}
    .pele-label {fill:#202024;}
    .pele-edge-label {fill:#737178;font-size:13px;}
  </style>
  <text x="40" y="52" fill="#202024" font-size="30" font-weight="600" letter-spacing="-.8">Who runs the query?</text>
  </svg>