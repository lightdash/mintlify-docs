name: Validate documentation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '**.md'
      - '**.mdx'
      - 'docs.json'
      - 'images/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/**'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install utility dependencies
        run: npm ci --ignore-scripts

      - name: Type-check and test utilities
        run: npm run check

      - name: Check documentation IA map
        run: node scripts/docs/render-ia-map.ts --check

      - name: List changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" > changed-files.txt

      - name: Run documentation validator
        id: validation
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          arguments=(--output docs-validation.json)
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            arguments+=(--changed-files changed-files.txt)
          fi

          set +e
          node scripts/docs/validate.ts "${arguments[@]}"
          exit_code=$?
          set -e
          if [[ ! -f docs-validation.json ]]; then
            printf '%s\n' '{"schemaVersion":1,"status":"tool_failure","scope":"unknown","summary":{"errors":0,"autoFixable":0},"findings":[],"error":"Validator exited before writing its report."}' > docs-validation.json
            exit_code=2
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload structured findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-validation
          path: docs-validation.json
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const report = require('./docs-validation.json');
          console.log('## Documentation validation');
          console.log('');
          if (report.status === 'tool_failure') {
            console.log('Validator failure. Inspect the job log and structured artifact.');
          } else {
            console.log(`${report.summary.errors} blocking finding(s), ${report.summary.autoFixable} auto-fixable.`);
          }
          NODE

      - name: Set validation result
        if: always()
        env:
          EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        run: exit "${EXIT_CODE:-2}"

  external-links:
    name: Audit external links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check external links
        id: external
        run: |
          set +e
          node scripts/docs/audit-external-links.ts --output external-links.json
          exit_code=$?
          set -e
          if [[ ! -f external-links.json ]]; then
            printf '%s\n' '{"schemaVersion":1,"status":"tool_failure","scope":"all","summary":{"warnings":0},"findings":[],"error":"External link checker exited before writing its report."}' > external-links.json
            exit_code=2
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload advisory findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-links
          path: external-links.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail on checker errors
        if: always() && steps.external.outputs.exit_code == '2'
        run: exit 2
