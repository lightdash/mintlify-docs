name: Report documentation validation

on: # zizmor: ignore[dangerous-triggers] Findings are parsed as comment data; PR code is never executed.
  workflow_run:
    workflows: [Validate documentation]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    name: Update pull request report
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Resolve pull request
        id: pull-request
        uses: actions/github-script@v9
        with:
          script: |
            let pullRequest = context.payload.workflow_run.pull_requests[0];
            if (!pullRequest) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.payload.workflow_run.head_sha,
              });
              pullRequest = data.find(({ state }) => state === 'open');
            }
            if (!pullRequest) {
              core.setFailed('Could not resolve the pull request for this validation run.');
              return;
            }
            core.setOutput('number', pullRequest?.number || '');

      - name: Download structured findings
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-validation
          path: validation-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download component findings
        id: component-artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: component-audit
          path: component-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Update validation comment
        uses: actions/github-script@v9
        env:
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.number }}
          VALIDATION_RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- docs-validation -->';
            let report;
            try {
              report = JSON.parse(fs.readFileSync('validation-artifact/docs-validation.json', 'utf8'));
            } catch (error) {
              report = {
                status: 'tool_failure',
                summary: { errors: 0, autoFixable: 0 },
                findings: [],
              };
            }
            const total = report.findings.length;
            const visible = report.findings.slice(0, 50);
            const status = report.status === 'passed'
              ? '✅ All blocking checks passed.'
              : report.status === 'tool_failure'
                ? '❌ The validator failed. This is a tooling error, not a content finding.'
                : `❌ ${report.summary.errors} blocking finding(s), including ${report.summary.autoFixable} auto-fixable.`;
            const rows = visible.map((item) => {
              const message = item.message.replaceAll('|', '\\|').replaceAll('\n', ' ');
              return `| \`${item.file}:${item.line}\` | \`${item.rule}\` | ${message} |`;
            });
            let body = `${marker}\n## Documentation validation\n\n${status}\n`;
            if (rows.length) {
              body += `\n| Location | Rule | Finding |\n| --- | --- | --- |\n${rows.join('\n')}\n`;
            }
            if (total > visible.length) body += `\nShowing ${visible.length} of ${total} findings.\n`;

            // Component findings are advisory unless a rule regressed; they are
            // annotated inline on the diff, so this only needs to summarise.
            let components;
            try {
              components = JSON.parse(fs.readFileSync('component-artifact/component-audit.json', 'utf8'));
            } catch (error) {
              components = undefined;
            }
            if (components) {
              const changedRules = Object.entries(components.summary.byRule || {})
                .sort(([, a], [, b]) => b - a);
              body += `\n### Component system\n\n${components.summary.warnings} finding(s) across the corpus.`;
              if (changedRules.length) {
                const top = changedRules.slice(0, 5)
                  .map(([rule, count]) => `\`${rule}\` ${count}`).join(' · ');
                body += ` Largest: ${top}.`;
              }
              body += `\n\nFindings on lines this pull request touched are annotated inline in **Files changed**.\n`;
            }

            body += `\n[Download the structured JSON artifact](${process.env.VALIDATION_RUN_URL}).`;

            const issueNumber = Number(process.env.PULL_REQUEST_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
