name: Learn walkthrough citations

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - '**.mdx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/learn-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-walkthroughs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  citations:
    name: Learn walkthrough citations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: docs
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout current product main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lightdash/lightdash
          ref: main
          path: lightdash
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true

      - name: Install docs parser dependencies
        id: install
        working-directory: docs
        run: npm ci --ignore-scripts

      - name: Test citation validation
        working-directory: docs
        run: node --test .github/workflows/learn-*.test.mjs

      - name: Check citation targets against base and proposed docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node docs/.github/workflows/learn-citations.mjs
          node docs/.github/workflows/learn-findings.mjs

      - name: Report parser setup failure
        if: failure() && steps.install.outcome == 'failure'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          PRODUCT_SHA=$(git -C lightdash rev-parse HEAD) DOCS_HEAD_SHA=$(git -C docs rev-parse HEAD) node -e 'const fs=require("fs");fs.writeFileSync("revisions.json",JSON.stringify({productSha:process.env.PRODUCT_SHA,docsHeadSha:process.env.DOCS_HEAD_SHA,docsBaseSha:process.env.BASE_SHA || null}));fs.writeFileSync("base.json","[]");fs.writeFileSync("head.json",JSON.stringify([{level:"error",category:"tool",file:"setup",message:"Docs parser dependency setup failed; see Install docs parser dependencies logs"}]))'
          node docs/.github/workflows/learn-findings.mjs

      - name: Upload Learn findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: learn-findings
          path: |
            revisions.json
            citation-inventory.json
            base-findings.json
            head-findings.json
            comparison.json
